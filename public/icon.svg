<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="120" y1="120" x2="392" y2="392" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00C288" />
      <stop offset="50%" stop-color="#00D2D3" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <filter id="glow" x="60" y="60" width="392" height="392" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />
  <rect width="510" height="510" x="1" y="1" rx="107" stroke="rgba(255,255,255,0.08)" stroke-width="2" fill="none" />

  <!-- Academic Shield / Tech Geometric Shape -->
  <g filter="url(#glow)">
    <!-- Shield Outline -->
    <path d="M256 96L384 144V264C384 340 328 396 256 424C184 396 128 340 128 264V144L256 96Z" 
          fill="#0f172a" fill-opacity="0.8" stroke="url(#accentGrad)" stroke-width="12" stroke-linejoin="round" />
    
    <!-- Mega 'M' & Open Academic Book Crest -->
    <path d="M192 310C216 295 240 295 256 304C272 295 296 295 320 310" 
          stroke="url(#accentGrad)" stroke-width="10" stroke-linecap="round" />
    <path d="M256 210V304" 
          stroke="url(#accentGrad)" stroke-width="8" stroke-linecap="round" />
    
    <!-- Stylized 'M' / Graduation Cap lines -->
    <path d="M180 220L256 160L332 220L256 270L180 220Z" 
          fill="url(#accentGrad)" fill-opacity="0.15" stroke="url(#accentGrad)" stroke-width="10" stroke-linejoin="round" />
    
    <!-- Tassel / Code Accent -->
    <circle cx="256" cy="215" r="8" fill="#00D2D3" />
    <path d="M332 220V260" stroke="#00C288" stroke-width="6" stroke-linecap="round" />
    <circle cx="332" cy="264" r="5" fill="#00C288" />
  </g>

  <!-- Decorative Rings -->
  <circle cx="256" cy="256" r="190" stroke="rgba(0, 194, 136, 0.15)" stroke-width="2" stroke-dasharray="6 8" />
</svg>
